<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>A-Group Blitz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&family=Prompt:wght@500;700&display=swap" rel="stylesheet">
<style>
/* layout: one centered game box. menu of 3 games, then the group table (periods 1-7 by groups 1A-8A) with a HUD above it, ranking table below */
:root {
  --bg: #f1f5f9;
  --panel: #ffffff;
  --ink: #1e293b;
  --muted: #64748b;
  --line: #e2e8f0;
  --blue: #2563eb;
  --violet: #7c3aed;
  --green: #16a34a;
  --hud-bg: #eff6ff;
  --card-bg: #fde047;
  --card-line: #f59e0b;
  --card-ink: #422006;
  --slot-bg: #f8fafc;
  --slot-line: #94a3b8;
  --head-bg: #1e293b;
  --head-ink: #ffffff;
  --per-bg: #e2e8f0;
  --ok-bg: #dcfce7;
  --ok: #16a34a;
  --ok-ink: #15803d;
  --bad-bg: #fee2e2;
  --bad: #dc2626;
  --font-display: 'Prompt', 'Noto Sans Thai', system-ui, sans-serif;
  --font-body: 'Noto Sans Thai', 'Prompt', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a; --panel: #1e293b; --ink: #e2e8f0; --muted: #94a3b8; --line: #334155;
    --blue: #3b6ff0; --violet: #8b5cf6; --green: #22a85a; --hud-bg: #172554;
    --card-bg: #facc15; --card-line: #eab308; --card-ink: #422006;
    --slot-bg: #0f172a; --slot-line: #64748b; --head-bg: #0b1220; --head-ink: #e2e8f0; --per-bg: #334155;
    --ok-bg: #123325; --ok: #3ecb85; --ok-ink: #86efac; --bad-bg: #3a1a1f; --bad: #f87171;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f172a; --panel: #1e293b; --ink: #e2e8f0; --muted: #94a3b8; --line: #334155;
  --blue: #3b6ff0; --violet: #8b5cf6; --green: #22a85a; --hud-bg: #172554;
  --card-bg: #facc15; --card-line: #eab308; --card-ink: #422006;
  --slot-bg: #0f172a; --slot-line: #64748b; --head-bg: #0b1220; --head-ink: #e2e8f0; --per-bg: #334155;
  --ok-bg: #123325; --ok: #3ecb85; --ok-ink: #86efac; --bad-bg: #3a1a1f; --bad: #f87171;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); text-align: center;
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.box { max-width: 820px; margin: 0 auto; background: var(--panel); padding: 18px; border-radius: 14px; border: 1px solid var(--line); min-width: 0; }
h1 { margin: 0; font-family: var(--font-display); font-size: 24px; color: var(--blue); line-height: 1.3; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin: 2px 0 12px; }
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 6px 0; }
.btn {
  padding: 12px 16px; font-family: var(--font-display); font-size: 16px; font-weight: 700; color: #fff;
  background: var(--blue); border: none; border-radius: 10px; cursor: pointer; min-height: 48px; touch-action: manipulation;
}
.btn.b2 { background: var(--violet); }
.btn.b3 { background: var(--green); }
.btn small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; opacity: .92; }
.btn.grey { background: #64748b; padding: 4px 12px; min-height: 34px; font-size: 13px; }
.btn.submit { width: 100%; max-width: 280px; margin-top: 12px; background: var(--green); }
button:focus-visible, .inp:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.msg { margin: 10px 0 4px; padding: 10px 14px; background: var(--ok-bg); color: var(--ok-ink); border-radius: 10px; font-weight: 600; }
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--hud-bg); padding: 8px 14px; border-radius: 10px; font-weight: 700; margin: 10px 0; }
.hud .time { color: var(--blue); font-family: var(--font-display); font-size: 21px; font-variant-numeric: tabular-nums; }
.card {
  display: inline-flex; align-items: center; justify-content: center; min-width: 76px; height: 76px; padding: 0 12px;
  background: var(--card-bg); color: var(--card-ink); border: 3px solid var(--card-line); border-radius: 12px;
  font-family: var(--font-display); font-size: 30px; font-weight: 700; margin-bottom: 6px;
}
.how { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.grid-wrap { overflow-x: auto; padding-bottom: 4px; }
.grid { display: grid; grid-template-columns: 46px repeat(8, minmax(0, 1fr)); gap: 4px; min-width: 520px; }
.grid.wide { min-width: 980px; }
.head { background: var(--head-bg); color: var(--head-ink); padding: 6px 2px; border-radius: 6px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.per { background: var(--per-bg); display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 700; }
.slot {
  height: 44px; border: 2px dashed var(--slot-line); border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; background: var(--slot-bg); cursor: pointer; min-width: 0; touch-action: manipulation;
}
.slot.typed { border-style: solid; cursor: text; }
.slot.empty { border: none; background: transparent; pointer-events: none; }
.slot.filled { background: var(--ok-bg); border: 2px solid var(--ok); color: var(--ok-ink); cursor: default; }
.slot.wrong { background: var(--bad-bg); border: 2px solid var(--bad); }
.inp {
  width: 100%; height: 100%; border: none; background: transparent; text-align: center; color: inherit;
  font-family: inherit; font-size: 15px; font-weight: 700; outline: none; padding: 0 2px; min-width: 0;
}
.grid.wide .inp { font-size: 12px; }
.inp:disabled { color: inherit; -webkit-text-fill-color: currentColor; opacity: 1; }
.slot.wrong .inp { color: var(--bad); }
.btn.b4 { background: #0e7490; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 8px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; }
.cell { height: 46px; border: 2px solid var(--line); border-radius: 6px; background: var(--slot-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; min-width: 0; }
.cell b { font-family: var(--font-display); font-size: 16px; }
.cell span { display: none; font-size: 10px; color: var(--muted); }
.cell.empty { border: none; background: transparent; }
.grid.names { min-width: 780px; }
.grid.names .cell { height: 56px; }
.grid.names .cell span { display: block; }
.tablebox { overflow-x: auto; margin-top: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
.nodata { text-align: center; color: var(--muted); }
.credit { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .slot { transition: background-color .12s, border-color .12s; }
}
</style>

<div class="box">
  <h1>⚛️ ตารางธาตุหมู่ A</h1>
  <p class="sub">หมู่ 1A–8A คาบ 1–7 (ไม่มีเลขอะตอม/เลขมวล)</p>

  <div id="msg" class="msg" hidden role="status"></div>

  <div id="menu" class="menu">
    <button class="btn" id="m1">🎯 เกม 1: จับวางให้ไว<small>ดูสัญลักษณ์ แล้วแตะช่องที่ถูก</small></button>
    <button class="btn b2" id="m2">⌨️ เกม 2: พิมพ์ชื่อเต็ม<small>พิมพ์ชื่อภาษาอังกฤษ เช่น Sodium</small></button>
    <button class="btn b3" id="m3">🔤 เกม 3: พิมพ์ชื่อย่อ<small>พิมพ์สัญลักษณ์ เช่น Na</small></button>
    <button class="btn b4" id="m0">📖 ดูตารางธาตุ<small>ดูอย่างเดียว ยังไม่เริ่มเกม</small></button>
  </div>

  <div id="study" hidden>
    <div class="hud">
      <span>📖 ตารางธาตุหมู่ A</span>
      <button class="btn grey" id="studyback">ออก</button>
    </div>
    <p class="how" id="studyhow"></p>
    <label class="toggle"><input type="checkbox" id="showname" checked> แสดงชื่อเต็มใต้สัญลักษณ์</label>
    <div class="grid-wrap"><div class="grid" id="sgrid"></div></div>
    <button class="btn submit" id="gostart" hidden></button>
  </div>

  <div id="play" hidden>
    <div class="hud">
      <span id="prog">0/50</span>
      <span class="time" id="time">0.00 วิ</span>
      <button class="btn grey" id="back">ออก</button>
    </div>
    <div id="cardbox" hidden>
      <div class="card" id="card">H</div>
    </div>
    <p class="how" id="how"></p>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <button class="btn submit" id="sub" hidden>✅ ส่งคำตอบ</button>
  </div>

  <div class="tablebox">
    <table>
      <thead><tr><th>อันดับ</th><th>เกม</th><th>ผลลัพธ์</th><th>เวลา</th></tr></thead>
      <tbody id="rank"><tr><td colspan="4" class="nodata">ยังไม่มีสถิติ</td></tr></tbody>
    </table>
  </div>

  <div class="credit">จัดทำโดย น.ส. พิชชาภา เบ็ญจรัตน์ ม.5/3</div>
</div>

<script>
/* symbol, full name, group (A), period, [other accepted spellings] */
const RAW = [
  ['H','Hydrogen',1,1],['He','Helium',8,1],
  ['Li','Lithium',1,2],['Be','Beryllium',2,2],['B','Boron',3,2],['C','Carbon',4,2],['N','Nitrogen',5,2],['O','Oxygen',6,2],['F','Fluorine',7,2],['Ne','Neon',8,2],
  ['Na','Sodium',1,3],['Mg','Magnesium',2,3],['Al','Aluminium',3,3,['aluminum']],['Si','Silicon',4,3],['P','Phosphorus',5,3],['S','Sulfur',6,3,['sulphur']],['Cl','Chlorine',7,3],['Ar','Argon',8,3],
  ['K','Potassium',1,4],['Ca','Calcium',2,4],['Ga','Gallium',3,4],['Ge','Germanium',4,4],['As','Arsenic',5,4],['Se','Selenium',6,4],['Br','Bromine',7,4],['Kr','Krypton',8,4],
  ['Rb','Rubidium',1,5],['Sr','Strontium',2,5],['In','Indium',3,5],['Sn','Tin',4,5],['Sb','Antimony',5,5],['Te','Tellurium',6,5],['I','Iodine',7,5],['Xe','Xenon',8,5],
  ['Cs','Caesium',1,6,['cesium']],['Ba','Barium',2,6],['Tl','Thallium',3,6],['Pb','Lead',4,6],['Bi','Bismuth',5,6],['Po','Polonium',6,6],['At','Astatine',7,6],['Rn','Radon',8,6],
  ['Fr','Francium',1,7],['Ra','Radium',2,7],['Nh','Nihonium',3,7],['Fl','Flerovium',4,7],['Mc','Moscovium',5,7],['Lv','Livermorium',6,7],['Ts','Tennessine',7,7],['Og','Oganesson',8,7]
];
const data = RAW.map(([s, n, g, p, alt]) => ({ s, n, g, p, alt: alt || [] }));
const at = {};
data.forEach(d => { at[d.g + '-' + d.p] = d; });
const MODES = { 1: 'เกม 1 จับวาง', 2: 'เกม 2 ชื่อเต็ม', 3: 'เกม 3 ชื่อย่อ' };
const HOW = {
  1: 'แตะช่องในตารางเพื่อวางธาตุตามสัญลักษณ์บนการ์ด (วางผิด +3 วินาที)',
  2: 'พิมพ์ชื่อเต็มภาษาอังกฤษของธาตุลงทุกช่อง แล้วกดส่งคำตอบ (เลื่อนตารางซ้าย-ขวาได้ กด Enter เพื่อไปช่องถัดไป)',
  3: 'พิมพ์ชื่อย่อ (สัญลักษณ์) ลงทุกช่อง ระบบจะปรับตัวพิมพ์ใหญ่เล็กให้ แล้วกดส่งคำตอบ'
};
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let mode = 1, pool = [], cur = null, t0 = 0, pen = 0, timer = null, count = 0, done = false, ranks = [];
try { ranks = JSON.parse(localStorage.getItem('agroup-ranks') || '[]'); if (!Array.isArray(ranks)) ranks = []; } catch (e) { ranks = []; }
function saveRanks() { try { localStorage.setItem('agroup-ranks', JSON.stringify(ranks.slice(0, 30))); } catch (e) {} }

function clock() {
  if (done) return;
  $('time').textContent = ((Date.now() - t0) / 1000 + pen).toFixed(2) + ' วิ';
}
function showMenu() {
  clearInterval(timer);
  $('menu').hidden = false;
  $('study').hidden = true;
  $('play').hidden = true;
}
function start(m) {
  mode = m; count = 0; pen = 0; done = false; clearInterval(timer);
  $('msg').hidden = true;
  $('menu').hidden = true;
  $('study').hidden = true;
  $('play').hidden = false;
  $('cardbox').hidden = m !== 1;
  $('sub').hidden = m === 1;
  $('how').textContent = HOW[m];
  $('prog').textContent = '0/50';
  buildGrid();
  if (m === 1) { pool = shuffle(data); next(); }
  t0 = Date.now();
  timer = setInterval(clock, 50);
  clock();
  window.scrollTo(0, 0);
}

function buildGrid() {
  const g = $('grid');
  g.className = 'grid' + (mode === 2 ? ' wide' : '');
  let h = '<div class="head">คาบ\\หมู่</div>' + [1, 2, 3, 4, 5, 6, 7, 8].map(x => '<div class="head">' + x + 'A</div>').join('');
  for (let p = 1; p <= 7; p++) {
    h += '<div class="per">' + p + '</div>';
    for (let x = 1; x <= 8; x++) {
      if (p === 1 && x > 1 && x < 8) h += '<div class="slot empty"></div>';
      else if (mode === 1) h += '<div class="slot" data-g="' + x + '" data-p="' + p + '" role="button" aria-label="หมู่ ' + x + 'A คาบ ' + p + '"></div>';
      else h += '<div class="slot typed"><input class="inp" maxlength="' + (mode === 2 ? 14 : 2) + '" autocomplete="off" autocorrect="off" spellcheck="false" ' +
        (mode === 2 ? 'autocapitalize="words"' : 'autocapitalize="characters"') + ' aria-label="หมู่ ' + x + 'A คาบ ' + p + '" data-g="' + x + '" data-p="' + p + '"></div>';
    }
  }
  g.innerHTML = h;
}

function next() {
  if (!pool.length) return end(50);
  cur = pool.pop();
  $('card').textContent = cur.s;
}

$('grid').addEventListener('click', e => {
  if (mode !== 1 || done) return;
  const s = e.target.closest('.slot[data-g]');
  if (!s || s.classList.contains('filled')) return;
  if (+s.dataset.g === cur.g && +s.dataset.p === cur.p) {
    s.textContent = cur.s; s.classList.add('filled'); count++;
    $('prog').textContent = count + '/50';
    next();
  } else {
    pen += 3; s.classList.add('wrong');
    setTimeout(() => s.classList.remove('wrong'), 350);
  }
});

$('grid').addEventListener('input', e => {
  const i = e.target.closest('.inp'); if (!i) return;
  if (mode === 3) {
    const v = i.value.trim();
    i.value = v.charAt(0).toUpperCase() + v.slice(1).toLowerCase();
  }
  let f = 0;
  $('grid').querySelectorAll('.inp').forEach(x => { if (x.value.trim()) f++; });
  $('prog').textContent = f + '/50';
});
$('grid').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.classList.contains('inp')) return;
  const all = [...$('grid').querySelectorAll('.inp')];
  const k = all.indexOf(e.target);
  if (all[k + 1]) { e.preventDefault(); all[k + 1].focus(); }
});

$('sub').onclick = () => {
  if (done) return;
  let ok = 0;
  $('grid').querySelectorAll('.inp').forEach(i => {
    const d = at[i.dataset.g + '-' + i.dataset.p];
    const v = i.value.trim();
    const good = mode === 2
      ? [d.n.toLowerCase(), ...d.alt].includes(v.toLowerCase().replace(/\s+/g, ''))
      : v === d.s;
    i.disabled = true;
    if (good) { ok++; i.parentElement.classList.add('filled'); }
    else {
      i.parentElement.classList.add('wrong');
      i.title = 'คำตอบของคุณ: ' + (v || '(ว่าง)');
      i.value = mode === 2 ? d.n : (v ? v + '(' + d.s + ')' : d.s);
    }
  });
  $('sub').hidden = true;
  end(ok);
};

function end(score) {
  clearInterval(timer); done = true;
  const t = +((Date.now() - t0) / 1000 + pen).toFixed(2);
  $('time').textContent = t.toFixed(2) + ' วิ';
  ranks.push({ m: mode, sc: score, t });
  renderRanks(); saveRanks();
  const msg = $('msg');
  msg.textContent = MODES[mode] + ': ได้ ' + score + '/50 ใช้เวลา ' + t.toFixed(2) + ' วินาที' + (score === 50 ? ' ครบทุกช่อง!' : '');
  msg.hidden = false;
  if (mode === 1) showMenu();
}

function renderRanks() {
  ranks.sort((a, b) => b.sc - a.sc || a.t - b.t);
  $('rank').innerHTML = ranks.length
    ? ranks.slice(0, 10).map((r, i) => '<tr><td>#' + (i + 1) + '</td><td>' + MODES[r.m] + '</td><td>' + r.sc + '/50</td><td>' + r.t.toFixed(2) + ' วิ</td></tr>').join('')
    : '<tr><td colspan="4" class="nodata">ยังไม่มีสถิติ</td></tr>';
}

/* study screen: full table to look at before a game (or on its own) */
let pending = 0;
function applyNames() { $('sgrid').className = 'grid' + ($('showname').checked ? ' names' : ''); }
function buildStudy() {
  let h = '<div class="head">คาบ\\หมู่</div>' + [1, 2, 3, 4, 5, 6, 7, 8].map(x => '<div class="head">' + x + 'A</div>').join('');
  for (let p = 1; p <= 7; p++) {
    h += '<div class="per">' + p + '</div>';
    for (let x = 1; x <= 8; x++) {
      if (p === 1 && x > 1 && x < 8) h += '<div class="cell empty"></div>';
      else { const d = at[x + '-' + p]; h += '<div class="cell"><b>' + d.s + '</b><span>' + d.n + '</span></div>'; }
    }
  }
  $('sgrid').innerHTML = h;
  applyNames();
}
function openStudy(m) {
  pending = m; clearInterval(timer);
  $('msg').hidden = true;
  $('menu').hidden = true; $('play').hidden = true; $('study').hidden = false;
  buildStudy();
  $('gostart').hidden = !m;
  $('gostart').textContent = m ? '▶ เริ่ม ' + MODES[m] + ' (เวลาเริ่มนับตอนกดปุ่มนี้)' : '';
  $('studyhow').textContent = m
    ? 'ดูตารางให้จำได้ก่อน พร้อมเมื่อไรกดเริ่มเกม ตารางนี้จะหายไประหว่างเล่น'
    : 'ตารางธาตุหมู่ A ทั้ง 50 ธาตุ เลื่อนซ้าย-ขวาได้ถ้าจอแคบ';
  window.scrollTo(0, 0);
}
$('showname').onchange = applyNames;
$('gostart').onclick = () => start(pending);
$('studyback').onclick = showMenu;
$('m0').onclick = () => openStudy(0);
$('m1').onclick = () => openStudy(1);
$('m2').onclick = () => openStudy(2);
$('m3').onclick = () => openStudy(3);
$('back').onclick = showMenu;
renderRanks();
</script>

</body></html>
